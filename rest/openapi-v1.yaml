    FormSchema:
      type: object
      description: |
        Root object of a form schema (form-js format).
      properties:
        id:
          type: string
          description: |
            Form key (form-js form id). Required at deploy time - used as the form
            entity's key and for versioning: redeploying with the same id creates a
            new version.
        type:
          type: string
          default: default
          description: form-js schema type. Currently always `default`.
        components:
          type: array
          default: []
          description: List of form components.
          items:
            $ref: '#/components/schemas/FormComponent'
        schemaVersion:
          type: integer
          description: form-js schema format version, written by the editor on export.
    FormComponent:
      description: |
        A single form component (form-js component).
        Different component types use different fields.
        For a detailed property reference, see the
        [Camunda Forms element library](https://docs.camunda.io/docs/components/modeler/forms/form-element-library/forms-element-library/).
      allOf:
        - $ref: './components/schemas/InputUiComponent.yaml'
        - type: object
          required:
            - label
            - type
          properties:
            # --- Universal ---
            id:
              type: string
              description: |
                Unique component id within the schema. form-js requires it on every
                component; the editor generates it automatically, or it can be set
                manually.
            type:
              $ref: '#/components/schemas/FormComponentType'
            layout:
              type: object
              description: |
                form-js layout parameters (`row`, `columns`). The server does not use
                this field; the structure is passed through to the client as-is.
            conditional:
              $ref: '#/components/schemas/FormComponentConditional'
            properties:
              type: object
              additionalProperties:
                type: string
              description: Arbitrary user-defined component properties (key/value).
            components:
              type: array
              description: |
                Child components of container types (group, dynamiclist).
                Unused by other component types.
              items:
                $ref: '#/components/schemas/FormComponent'
            # --- Common input ---
            disabled:
              type: boolean
              description: Component is disabled (not editable). Used during development.
            readonly:
              allOf:
                - $ref: '#/components/schemas/BooleanOrExpression'
              description: |
                Read-only mode.
            validate:
              $ref: '#/components/schemas/FormComponentValidate'
            appearance:
              $ref: '#/components/schemas/FormComponentAppearance'
            # --- number ---
            increment:
              type: string
              description: Value step (for `number`).
            decimalDigits:
              type: integer
              description: Maximum number of decimal digits (for `number`).
            # --- datetime ---
            subtype:
              type: string
              description: 'datetime component subtype - `date`, `time`, or `datetime`.'
            dateLabel:
              type: string
              description: Label text for the date field. Plain text or a dynamic expression (FEEL / templating).
            timeLabel:
              type: string
              description: Label text for the time field. Plain text or a dynamic expression (FEEL / templating).
            timeSerializingFormat:
              type: string
              description: 'Time serialization format - `utc_offset`, `utc_normalized`, or `no_timezone`.'
            timeInterval:
              type: integer
              description: Time picker step, in minutes.
            use24h:
              type: boolean
              description: Use 24-hour time format.
            disallowPassedDates:
              type: boolean
              description: Disallow selecting past dates.
            # --- expression ---
            expression:
              type: string
              description: 'FEEL expression computing the component value (for `expression`).'
            computeOn:
              type: string
              description: When to evaluate the expression - change (on every form change) or presubmit (only before submit).
            # --- filepicker ---
            accept:
              type: string
              description: 'Comma-separated accepted file formats (MIME types or extensions, e.g. image/*, .pdf).'
            multiple:
              allOf:
                - $ref: '#/components/schemas/BooleanOrExpression'
              description: |
                Allow selecting multiple files.
            # --- select / checklist / radio / taglist ---
            valuesExpression:
              type: string
              description: 'FEEL expression returning the list of options (dynamic source).'
            searchable:
              type: boolean
              description: Allow keyboard search among options (for `select`).
            # --- spacer ---
            height:
              type: integer
              description: Vertical spacing height in pixels (for `spacer`).
            # --- dynamiclist / group ---
            showOutline:
              type: boolean
              description: Show a visual border around the group (for `group` and `dynamiclist`).
            isRepeating:
              type: boolean
              description: 'Technical flag for the dynamic-list component, set by form-js on creation.'
            allowAddRemove:
              type: boolean
              description: Allow adding and removing list items (for `dynamiclist`).
            defaultRepetitions:
              type: integer
              description: 'Number of dynamic-list items shown on initial render.'
            path:
              type: string
              description: |
                The form data path under which child component values are stored.
                A variable name ("address") or dot notation ("user.address"). Creates a
                nested object for group, an array for dynamiclist. If unset on a group,
                child fields live at the root.
            # --- button ---
            action:
              type: string
              description: Button action - `submit` or `reset`.
            # --- iframe ---
            url:
              type: string
              description: URL of the iframe content source. Plain text or a dynamic expression (FEEL / templating).
            security:
              $ref: '#/components/schemas/FormComponentSecurity'
            # --- documentPreview / table ---
            dataSource:
              type: string
              description: |
                FEEL expression returning the data source.
                For table - an array of record objects (one record = one table row);
                for documentPreview - an array of objects with document metadata.
            # --- text ---
            text:
              type: string
              description: Text content (Markdown). Plain text or a dynamic expression (FEEL / templating).
            # --- html ---
            content:
              type: string
              description: HTML content. Allows templating or static HTML; sanitized on the client.
            # --- image ---
            source:
              type: string
              description: Image source. Plain text (URL/data URI) or a dynamic expression (FEEL / templating).
            alt:
              type: string
              description: 'Alt text for the image (shown if the image fails to load).'
            # --- table ---
            rowCount:
              type: integer
              description: Table page size (used only when pagination is enabled).
            columnsExpression:
              type: string
              description: 'FEEL expression returning the table column definitions.'
    FormComponentConditional:
      type: object
      description: Conditional visibility of a component (form-js Conditional).
      properties:
        hide:
          type: string
          description: FEEL expression. The component is hidden when it evaluates to true.
    FormComponentValidate:
      type: object
      description: Validation rules for input components (form-js Validation).
      properties:
        required:
          type: boolean
          description: Field must be filled in.
        minLength:
          type: string
          description: Minimum value length. An integer (as a string) or a FEEL expression.
        maxLength:
          type: string
          description: Maximum value length. An integer (as a string) or a FEEL expression.
        pattern:
          type: string
          description: 'Regular expression the value must match.'
        patternErrorMessage:
          type: string
          description: 'Error message shown when the value does not match pattern. Only meaningful if pattern is set.'
    FormComponentAppearance:
      type: object
      description: Visual presentation of the value (form-js Appearance).
      properties:
        prefixAdorner:
          type: string
          description: |
            Prefix shown before the value (e.g. a currency symbol).
            Plain text or a dynamic expression (FEEL / templating).
        suffixAdorner:
          type: string
          description: |
            Suffix shown after the value (e.g. a unit of measure).
            Plain text or a dynamic expression (FEEL / templating).
    FormComponentSecurity:
      type: object
      description: 'Security settings for components that execute embedded code (iframe).'
      properties:
        allowScripts:
          type: boolean
          description: Allow scripts to run inside the iframe (HTML sandbox directive allow-scripts).
    BooleanOrExpression:
      oneOf:
        - type: boolean
        - type: string
      description: |
        A boolean value (`true`/`false`), or a FEEL expression as a string starting
        with `=` (e.g. `=isAdmin`).
    FormComponentType:
      type: string
      default: textfield
      description: |
        Form component type.
        Allowed values:
          - `textfield` - single-line text input
          - `textarea` - multi-line text input
          - `number` - numeric input
          - `select` - dropdown (single choice, large option sets)
          - `radio` - radio buttons (single choice, small option sets)
          - `checklist` - checkboxes (multiple choice, small option sets)
          - `checkbox` - single checkbox (boolean value)
          - `date` - date picker
          - `datetime` - date and/or time picker
          - `group` - group of nested components
          - `dynamiclist` - repeating list of nested components
          - `expression` - computed field (FEEL expression)
          - `iframe` - embedded external resource
          - `image` - image display
          - `filepicker` - file selection
          - `separator` - horizontal divider line
          - `spacer` - empty vertical space
          - `table` - tabular data display
          - `time` - time picker
          - `html` - HTML block
          - `button` - button (`submit` / `reset`)
          - `documentPreview` - document preview
          - `taglist` - tag selection (multiple choice, large option sets)
      enum:
        - textfield
        - textarea
        - number
        - select
        - radio
        - checklist
        - checkbox
        - date
        - datetime
        - duration
        - group
        - dynamiclist
        - juel
        - expression
        - iframe
        - image
        - filepicker
        - separator
        - spacer
        - table
        - time
        - html
        - button
        - documentPreview
        - taglist
