        allowedClassPrefixes:
          type: array
          description: |
            Package prefixes a `flowable:class` may start with. A class outside them is
            rejected at deployment.
          items:
            type: string
        activityWhitelistEnabled:
          type: boolean
          description: 'Whether `allowedActivityTypes` is enforced at all.'
        httpTaskEnabled:
          type: boolean
          description: 'Whether `<serviceTask flowable:type="http">` is available.'
      examples:
