openapi: 3.1.0
info:
  title: Briany BPM API
  version: 2.0.0
  description: |
    REST API for a Flowable-based BPM platform.

    All list endpoints return paginated results in a unified `PagedResponse` shape
    (`page`, `pageSize`, `totalElements`, `totalPages`, `hasNext`, `hasPrevious`).

    Authentication is HTTP Basic (Flowable IDM) or Bearer JWT (JWKS) - see the
    Security section.

  contact:
    email: ivan@moarse.ru
    name: Ivan Donchenko
    url: https://ivandonchenko.ru
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: 'https://briany.ru'
    description: Demo Stand
security:
  - BasicAuth: []
  - BearerAuth: []
tags:
  - name: Application
    description: 'Manages workflow applications. An application bundles related process definitions, forms, and resources into one workspace.'
  - name: Form
    description: Catalog of forms. Forms describe the user interface for tasks and start events.
  - name: Identity
    description: 'The authenticated principal. Resolves the current user and the groups they belong to, so the client can render assignment filters and claim actions without a directory API.'
  - name: ModelerApp
    description: 'Server-side BPMN/DMN/bform modeling workspace. Stores editable sources without an immediate engine deployment and tracks draft/synced/ahead synchronization state against Flowable.'
  - name: Platform
    description: 'Engine capabilities and the modeling palette. Describes what the deployed engine accepts, so a client never offers a construct the engine would reject.'
  - name: ProcessDefinition
    description: 'Catalog of process definitions. A process definition is a BPMN model describing a business process; it can have multiple versions.'
  - name: ProcessInstance
    description: Query and start process instances. A process instance is one concrete execution of a process definition.
  - name: Task
    description: 'Human tasks. A task is one unit of work assigned to a user or offered to a group of candidates; it may carry a form describing the data to collect.'
paths:
  /api/v1/me:
    get:
      tags:
        - Identity
      operationId: getCurrentUser
      summary: Get the authenticated user
      description: |
        Returns the principal behind the current request, together with the ids of the
        groups it belongs to. Flowable resolves candidate groups against exactly these
        ids, so a client can render group-based work lists without a directory API.
      responses:
        '200':
          description: The authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/engine-capabilities:
    get:
      tags:
        - Platform
      operationId: getEngineCapabilities
      summary: Get engine capabilities
      description: |
        Describes the constraints this deployment enforces on incoming models: which
        activity types may be deployed, which Spring beans a `flowable:delegateExpression`
        may resolve to, and which package prefixes a `flowable:class` may use. A modeling
        client reads this to avoid authoring a model that deployment validation rejects.
      responses:
        '200':
          description: Engine capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineCapabilities'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/bpmn-palette:
    get:
      tags:
        - Platform
      operationId: getBpmnPalette
      summary: Get the custom BPMN palette
      description: |
        Returns the custom element descriptors the deployment publishes. Each descriptor
        names the BPMN node it compiles into and carries the settings form for
        configuring it. An empty list is valid and means the palette holds only the
        built-in elements.
      responses:
        '200':
          description: The custom palette
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BpmnPalette'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/applications:
    get:
      tags:
        - Application
      x-spring-paginated: true
      operationId: listApplications
      summary: List applications (latest versions)
      description: |
        Returns a paginated list of workflow applications.
        Only the latest version of each application key is returned.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Page of applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags:
        - Application
      operationId: deployApplication
      summary: Deploys an application from a ZIP archive
      description: |
        Uploads a ZIP archive containing BPMN, DMN, bform, and other resources.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: ZIP archive containing bpmn/dmn/app/bform files.
      responses:
        '201':
          description: Application deployed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/applications/versions:
    get:
      tags:
        - Application
      x-spring-paginated: true
      operationId: listApplicationsVersions
      summary: List applications (all versions)
      description: |
        Returns a paginated list of workflow applications across all deployed versions.
        Each version is returned as a separate entry.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Page of applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  '/api/v1/applications/{key}':
    get:
      tags:
        - Application
      operationId: getApplication
      summary: Get application by key (latest version)
      description: |
        Returns a workflow application by its id or key.
        If multiple versions are deployed, only the latest is returned.
        Use `getApplicationVersion` for a specific version.
      responses:
        '200':
          description: Application data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    parameters:
      - $ref: '#/components/parameters/Key'
  '/api/v1/applications/{key}/versions':
    get:
      tags:
        - Application
      x-spring-paginated: true
      operationId: listApplicationVersions
      summary: Get application by key (all versions)
      description: |
        Returns all versions of an application by key or id.
        Unlike `getApplication`, not limited to the latest version.
      responses:
        '200':
          description: Page of application versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    parameters:
      - $ref: '#/components/parameters/Key'
  '/api/v1/applications/{key}/versions/{version}':
    get:
      tags:
        - Application
      operationId: getApplicationVersion
      summary: Get application by id or key (specific version)
      description: |
        Returns a specific application version by key or id and version number.
      responses:
        '200':
          description: Application data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    parameters:
      - $ref: '#/components/parameters/Key'
      - $ref: '#/components/parameters/Version'
  /api/v1/processes:
    get:
      tags:
        - ProcessDefinition
      x-spring-paginated: true
      operationId: listProcesses
      summary: List process definitions (latest versions)
      description: |
        Returns a paginated list of all process definitions.
        By default only the latest version of each definition is returned.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/IncludeStatsParam'
      responses:
        '200':
          description: Page of process definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDefinitionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/processes/versions:
    get:
      tags:
        - ProcessDefinition
      x-spring-paginated: true
      operationId: listProcessDefinitionsVersions
      summary: List process definitions (all versions)
      description: |
        Returns all versions of all process definitions, including superseded ones.
        Unlike `listProcessDefinitions`, not limited to the latest version per key.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: Page of process definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDefinitionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  '/api/v1/processes/{key}':
    get:
      tags:
        - ProcessDefinition
      operationId: getProcess
      summary: Get process definition by key (latest version)
      description: |
        Returns the latest process definition for a key.
      parameters:
        - $ref: '#/components/parameters/IncludeStatsParam'
      responses:
        '200':
          description: Process definition data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    parameters:
      - $ref: '#/components/parameters/Key'
  '/api/v1/processes/{key}/versions':
    get:
      tags:
        - ProcessDefinition
      x-spring-paginated: true
      operationId: listProcessDefinitionVersions
      summary: Get all versions of a process definition
      description: |
        Returns all versions of a process definition by key or id.
        Unlike `getProcessDefinition`, not limited to the latest version.
      responses:
        '200':
          description: Page of process definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDefinitionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    parameters:
      - $ref: '#/components/parameters/Key'
  '/api/v1/processes/{key}/versions/{version}':
    get:
      tags:
        - ProcessDefinition
      operationId: getProcessDefinitionVersion
      summary: Get process definition by version
      description: |
        Returns a specific process definition version by key or id and version number.
      responses:
        '200':
          description: Process definition data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    parameters:
      - $ref: '#/components/parameters/Key'
      - $ref: '#/components/parameters/Version'
  '/api/v1/processes/{key}/xml':
    get:
      tags:
        - ProcessDefinition
      operationId: getProcessXml
      summary: Get the BPMN XML of a process definition (latest version)
      description: |
        Returns the BPMN 2.0 XML source of the latest version of the process definition.
        This is the deployed resource itself, so a viewer renders exactly what the engine
        executes.
      responses:
        '200':
          description: BPMN XML source
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'Carries the deployed resource name, e.g. attachment; filename="orderProcess.bpmn".'
          content:
            application/xml:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    parameters:
      - $ref: '#/components/parameters/Key'
  '/api/v1/processes/{key}/versions/{version}/xml':
    get:
      tags:
        - ProcessDefinition
      operationId: getProcessVersionXml
      summary: Get the BPMN XML of a process definition version
      description: |
        Returns the BPMN 2.0 XML source of one specific version of the process definition.
      responses:
        '200':
          description: BPMN XML source
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Carries the deployed resource name.
          content:
            application/xml:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    parameters:
      - $ref: '#/components/parameters/Key'
      - $ref: '#/components/parameters/Version'
  '/api/v1/processes/{key}/start':
    post:
      tags:
        - ProcessInstance
      operationId: startProcessInstance
      summary: Start a process instance
      description: |
        Starts a new instance of the process definition. The latest version is used
        unless `version` names another one. A business key is an optional caller-supplied
        identifier, unique per process definition, that links the instance to a record in
        another system.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartProcessInstanceRequest'
      responses:
        '201':
          description: Process instance started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessInstance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    parameters:
      - $ref: '#/components/parameters/Key'
  '/api/v1/processes/{key}/start-form':
    get:
      tags:
        - ProcessDefinition
      operationId: getProcessStartForm
      summary: Get the start form of a process definition
      description: |
        Returns the form referenced by the `flowable:formKey` of the process start event,
        resolved to its deployed schema. Complements the `hasStartForm` flag on the
        definition: a definition without a start form answers `404`.
      responses:
        '200':
          description: The start form
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Form'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    parameters:
      - $ref: '#/components/parameters/Key'
  '/api/v1/processes/{key}/process-instances':
    get:
      tags:
        - ProcessInstance
      x-spring-paginated: true
      operationId: listProcessProcessInstances
      summary: List instances of a process definition
      description: |
        Returns a paginated list of process instances started from the given process
        definition (across all its versions).
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/ProcessInstanceState'
      responses:
        '200':
          description: Page of process instances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessInstancePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    parameters:
      - $ref: '#/components/parameters/Key'
  '/api/v1/processes/{key}/versions/{version}/process-instances':
    get:
      tags:
        - ProcessInstance
      x-spring-paginated: true
      operationId: listProcessDefinitionVersionInstances
      summary: List instances of a single process definition version
      description: |
        Returns process instances for one specific definition version.
        Unlike `listProcessDefinitionInstances`, filters only by the given version.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/ProcessInstanceState'
      responses:
        '200':
          description: Page of process instances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessInstancePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    parameters:
      - $ref: '#/components/parameters/Key'
      - $ref: '#/components/parameters/Version'
  /api/v1/process-instances:
    get:
      tags:
        - ProcessInstance
      x-spring-paginated: true
      operationId: listProcessInstances
      summary: List process instances
      description: |
        Returns a paginated list of all process instances.
        By default both active and completed instances are returned.
      parameters:
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/ProcessInstanceState'
      responses:
        '200':
          description: Page of process instances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessInstancePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  '/api/v1/process-instances/{id}':
    get:
      tags:
        - ProcessInstance
      operationId: getProcessInstance
      summary: Get process instance by id
      description: |
        Returns a single process instance by its id. Runtime and historic instances are
        served from the same path, so a link to an instance keeps working after it ends.
      responses:
        '200':
          description: Process instance data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessInstance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - ProcessInstance
      operationId: deleteProcessInstance
      summary: Delete the historic record of a process instance
      description: |
        Removes the instance and its history permanently. Unlike `cancelProcessInstance`,
        which ends a running instance but keeps its history queryable, this leaves no
        record behind.
      responses:
        '204':
          description: Process instance deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    parameters:
      - $ref: '#/components/parameters/Id'
  '/api/v1/process-instances/{id}/activities':
    get:
      tags:
        - ProcessInstance
      operationId: listProcessInstanceActivities
      summary: List the activity history of a process instance
      description: |
        Returns every activity the instance has entered, completed or been terminated in,
        in start order. `activityId` is the id of the BPMN element in the model, which is
        what joins a history entry to a shape on the diagram. A single instance's history
        is bounded, so the response is not paginated.
      responses:
        '200':
          description: Activity instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityInstance'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    parameters:
      - $ref: '#/components/parameters/Id'
  '/api/v1/process-instances/{id}/variables':
    get:
      tags:
        - ProcessInstance
      operationId: listProcessInstanceVariables
      summary: List the variables of a process instance
      description: |
        Returns the variables visible in the instance. A variable declared on the process
        instance itself has `global` scope; one declared on a child execution or a task has
        `local` scope and is visible only within it. Not paginated.
      responses:
        '200':
          description: Variables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Variable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    parameters:
      - $ref: '#/components/parameters/Id'
  '/api/v1/process-instances/{id}/cancel':
    post:
      tags:
        - ProcessInstance
      operationId: cancelProcessInstance
      summary: Cancel a running process instance
      description: |
        Terminates a running instance and all of its executions. The historic record is
        kept, so the instance remains queryable with the state it ended in. Use
        `deleteProcessInstance` to remove the history as well.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelProcessInstanceRequest'
      responses:
        '204':
          description: Process instance cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    parameters:
      - $ref: '#/components/parameters/Id'
  /api/v1/tasks:
    get:
      tags:
        - Task
      x-spring-paginated: true
      operationId: listTasks
      summary: List tasks
      description: |
        Returns a paginated list of human tasks. `assignment` is resolved on the server
        against the authenticated principal, so a client never has to fetch its own groups
        to build a work list.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - completed
            default: active
          description: |
            Filters by task state. `active` returns runtime tasks, `completed` returns
            historic ones.
        - name: assignment
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TaskAssignmentFilter'
          description: |
            Filters by the task's relation to the authenticated principal. Mutually
            exclusive with `assignee`.
        - name: assignee
          in: query
          required: false
          schema:
            type: string
          description: 'Filters by an explicit assignee id. Mutually exclusive with `assignment`.'
        - name: processDefinitionKey
          in: query
          required: false
          schema:
            type: string
          description: Filters by the key of the process definition the task belongs to.
        - name: processInstanceId
          in: query
          required: false
          schema:
            type: string
          description: Filters by the process instance the task belongs to.
        - name: taskDefinitionKey
          in: query
          required: false
          schema:
            type: string
          description: 'Filters by the id of the user task element in the BPMN model.'
        - name: nameLike
          in: query
          required: false
          schema:
            type: string
          description: 'Case-insensitive substring match on the task name.'
        - name: dueBefore
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Returns tasks due strictly before this instant.
        - name: dueAfter
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Returns tasks due strictly after this instant.
      responses:
        '200':
          description: Page of tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  '/api/v1/tasks/{id}':
    get:
      tags:
        - Task
      operationId: getTask
      summary: Get a task by id
      description: |
        Returns one task. Runtime and historic tasks are served from the same path, so a
        link to a task keeps working after it is completed.
      responses:
        '200':
          description: Task data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    parameters:
      - $ref: '#/components/parameters/Id'
  '/api/v1/tasks/{id}/form':
    get:
      tags:
        - Task
      operationId: getFormedTask
      summary: Get the form of a task
      description: |
        Returns the task, the deployed schema of the form its `formKey` names, and the
        current values of the variables that form binds. A task without a `formKey`
        answers `404` with the code `TASK_HAS_NO_FORM`, which a client handles by
        collecting the variables directly instead of treating it as an error.
      responses:
        '200':
          description: Task with its form and bound variables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormedTask'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    parameters:
      - $ref: '#/components/parameters/Id'
  '/api/v1/tasks/{id}/claim':
    post:
      tags:
        - Task
      operationId: claimTask
      summary: Claim a task
      description: |
        Assigns the task to the authenticated principal. Claiming a task that already has
        an assignee is a conflict; unassign it first.
      responses:
        '200':
          description: The claimed task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    parameters:
      - $ref: '#/components/parameters/Id'
  '/api/v1/tasks/{id}/unclaim':
    post:
      tags:
        - Task
      operationId: unclaimTask
      summary: Unclaim a task
      description: |
        Clears the assignee, returning the task to the pool its candidate users and
        candidate groups can claim from.
      responses:
        '200':
          description: The unclaimed task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    parameters:
      - $ref: '#/components/parameters/Id'
  '/api/v1/tasks/{id}/assign':
    post:
      tags:
        - Task
      operationId: assignTask
      summary: Assign a task to a user
      description: |
        Sets the assignee of the task to the given user, replacing any current assignee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTaskRequest'
      responses:
        '200':
          description: The assigned task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    parameters:
      - $ref: '#/components/parameters/Id'
  '/api/v1/tasks/{id}/complete':
    post:
      tags:
        - Task
      operationId: completeTask
      summary: Complete a task
      description: |
        Completes the task and continues the process. Variables in the body are set on the
        process instance before the task is completed, so they are visible to everything
        downstream of it.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteTaskRequest'
      responses:
        '204':
          description: Task completed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    parameters:
      - $ref: '#/components/parameters/Id'
  /api/v1/forms:
    get:
      tags:
        - Form
      x-spring-paginated: true
      operationId: listForms
      summary: List forms (latest versions)
      description: |
        Returns a paginated list of forms.
        By default only the latest version of each form is returned.
      parameters:
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Page of forms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormSummaryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  '/api/v1/forms/{key}':
    get:
      tags:
        - Form
      operationId: getForm
      summary: Get form by key (latest version)
      description: |
        Returns a form by its id or key.
        If multiple versions are deployed, only the latest (highest version number) is
        returned.
        The form includes the full JSON schema (`schema`) and the list of variables
        bound to it (`variables`).
      responses:
        '200':
          description: Form data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Form'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    parameters:
      - $ref: '#/components/parameters/Key'
  '/api/v1/forms/{key}/versions':
    get:
      tags:
        - Form
      x-spring-paginated: true
      operationId: getFormVersions
      summary: Get form by id or key (all versions)
      description: |
        Returns all versions of a form by key or id. Unlike `getForm`, not limited to the latest version.
      responses:
        '200':
          description: Page of forms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormSummaryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    parameters:
      - $ref: '#/components/parameters/Key'
  '/api/v1/forms/{key}/versions/{version}':
    get:
      tags:
        - Form
      operationId: getFormVersion
      summary: Get form by id or key (specific version)
      description: |
        Returns a specific form version by key or id and version number.
      responses:
        '200':
          description: Form data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Form'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    parameters:
      - $ref: '#/components/parameters/Key'
      - $ref: '#/components/parameters/Version'
  /api/v1/modeler-apps:
    get:
      tags:
        - ModelerApp
      x-spring-paginated: true
      operationId: listModelerApps
      summary: List modeler apps
      description: |
        Returns a paginated list of modeler apps. Optionally filtered by synchronization state.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - $ref: '#/components/parameters/IncludeStatsParam'
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ModelerAppState'
          description: Filters by synchronization state. If omitted, all modeler apps are returned.
      responses:
        '200':
          description: Page of modeler apps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelerAppPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - ModelerApp
      operationId: createModelerApp
      summary: Create a modeler app
      description: |
        Creates an empty modeler app workspace identified by a unique key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateModelerAppRequest'
      responses:
        '201':
          description: Modeler app created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelerApp'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  '/api/v1/modeler-apps/{key}':
    get:
      tags:
        - ModelerApp
      operationId: getModelerApp
      summary: Get a modeler app by key
      description: |
        Returns a modeler app with its files and, when deployed, the embedded deployed application.
      parameters:
        - $ref: '#/components/parameters/IncludeStatsParam'
      responses:
        '200':
          description: Modeler app data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelerApp'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - ModelerApp
      operationId: updateModelerApp
      summary: Update modeler app metadata
      description: |
        Updates the mutable metadata of a modeler app. The key is immutable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateModelerAppRequest'
      responses:
        '200':
          description: Modeler app updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelerApp'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - ModelerApp
      operationId: deleteModelerApp
      summary: Delete a modeler app
      description: |
        Deletes a modeler app and its files. If the app is deployed, the engine deployment is cascade-removed.
      responses:
        '204':
          description: Modeler app deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    parameters:
      - $ref: '#/components/parameters/Key'
  '/api/v1/modeler-apps/{key}/deploy':
    post:
      tags:
        - ModelerApp
      operationId: deployModelerApp
      summary: Deploy a modeler app to the engine
      description: |
        Synthesizes an .app resource, bundles the workspace files, and deploys them to Flowable.
      responses:
        '200':
          description: Modeler app deployed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelerApp'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    parameters:
      - $ref: '#/components/parameters/Key'
  '/api/v1/modeler-apps/{key}/undeploy':
    post:
      tags:
        - ModelerApp
      operationId: undeployModelerApp
      summary: Undeploy a modeler app
      description: |
        Removes the engine deployment while keeping the workspace, returning the app to draft state.
      responses:
        '200':
          description: Modeler app undeployed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelerApp'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    parameters:
      - $ref: '#/components/parameters/Key'
  '/api/v1/modeler-apps/{key}/files':
    get:
      tags:
        - ModelerApp
      operationId: listModelerAppFiles
      summary: List modeler app files
      description: |
        Returns the summaries of all files in a modeler app workspace.
      responses:
        '200':
          description: List of modeler app file summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelerAppFileSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - ModelerApp
      operationId: upsertModelerAppFile
      summary: Upload or replace a modeler app file
      description: |
        Uploads a bpmn/dmn/bform file. The file key is derived from the content; an existing file with the same key is replaced.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: A single bpmn/dmn/bform source file.
      responses:
        '200':
          description: Existing file replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelerAppFile'
        '201':
          description: New file created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelerAppFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    parameters:
      - $ref: '#/components/parameters/Key'
  '/api/v1/modeler-apps/{key}/files/{fileKey}':
    get:
      tags:
        - ModelerApp
      operationId: getModelerAppFile
      summary: Get a modeler app file
      description: |
        Returns the metadata of a single file: state, hashes, errors, and engine resource id.
      responses:
        '200':
          description: Modeler app file metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelerAppFile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - ModelerApp
      operationId: updateModelerAppFileContent
      summary: Replace a modeler app file content
      description: |
        Replaces the content of an existing file. The derived key must match the path file key.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: A single bpmn/dmn/bform source file.
      responses:
        '200':
          description: File content replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelerAppFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - ModelerApp
      operationId: deleteModelerAppFile
      summary: Delete a modeler app file
      description: |
        Removes a file from the workspace. If the app is deployed, it becomes ahead.
      responses:
        '204':
          description: File deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    parameters:
      - $ref: '#/components/parameters/Key'
      - $ref: '#/components/parameters/FileKey'
  '/api/v1/modeler-apps/{key}/files/{fileKey}/content':
    get:
      tags:
        - ModelerApp
      operationId: getModelerAppFileContent
      summary: Get raw modeler app file content
      description: |
        Returns the raw source bytes of a file with a Content-Disposition header carrying the resource name.
      responses:
        '200':
          description: Raw file content
          content:
            application/xml:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    parameters:
      - $ref: '#/components/parameters/Key'
      - $ref: '#/components/parameters/FileKey'
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: Checked against Flowable IDM (see FlowableAuthStrategy).
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer JWT validated against a JWKS endpoint (see JwksStrategy).
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    SizeParam:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 25
    SortParam:
      name: sort
      in: query
      description: 'Sort criterion: field[,asc|desc]. Example: name,asc'
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    Key:
      name: key
      in: path
      required: true
      schema:
        type: string
      description: definition key
    IncludeStatsParam:
      name: includeStats
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: |
        Includes the optional `stats` projection in the response. Computing instance
        counts costs an extra aggregation per row, so it is opt-in and default listings
        stay cheap.
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: 'Engine-assigned identifier. Opaque: do not parse it.'
    ProcessInstanceState:
      name: state
      in: query
      schema:
        enum:
          - running
          - completed
          - suspended
      description: |
        Filters by process instance state. If omitted, all processes are returned.
        - `running` - not yet finished (active and suspended)
        - `completed` - finished
    Version:
      name: version
      in: path
      required: true
      schema:
        type: integer
      description: Version identifier
    FileKey:
      name: fileKey
      in: path
      required: true
      schema:
        type: string
      description: file key derived from the file content
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication is required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated principal is not allowed to access the resource
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State conflict or business rule violation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Upstream dependency is unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required:
        - detail
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        instance:
          type: string
          format: uri-reference
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
    AppDefinition:
      type: object
      examples:
        - id: 'app:12'
          key: loans
          version: 1
          name: Loans Workspace
          description: Loan workflow cockpit
          icon: bank
          theme: default
      required:
        - id
        - key
        - name
        - version
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        version:
          type: integer
        resourceName:
          type: string
        deploymentId:
          type: string
    Application:
      examples:
        - id: 'app:12'
          key: loans
          version: 1
          name: Loans Workspace
          description: Loan workflow cockpit
          icon: bank
          theme: default
      allOf:
        - type: object
          properties:
            deployedResources:
              $ref: '#/components/schemas/ApplicationDeployedResources'
        - $ref: '#/components/schemas/ApplicationRef'
    ApplicationDeployedResources:
      type: object
      properties:
        processDefinitions:
          type: array
          items:
            $ref: '#/components/schemas/ResourceRef'
        bforms:
          type: array
          items:
            $ref: '#/components/schemas/ResourceRef'
    ApplicationRef:
      allOf:
        - type: object
          properties:
            icon:
              type: string
            theme:
              type: string
            deploymentTime:
              type: string
              format: date-time
        - $ref: '#/components/schemas/AppDefinition'
    ApplicationPage:
      x-kotlin-implements:
        - ru.briany.common.api.dtos.PagedList<ApplicationRef>
      x-kotlin-implements-fields:
        - data
        - page
        - pageSize
        - totalElements
        - totalPages
        - hasNext
        - hasPrevious
      allOf:
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ApplicationRef'
        - $ref: '#/components/schemas/PagedResponse'
    ProcessDefinition:
      type: object
      examples:
        - id: 'orderProcess:7:4a0716d3'
          key: orderProcess
          name: Order Process
          description: Order approval and fulfillment process
          version: 7
          category: workflow
          deploymentId: dep-7741
          hasStartForm: false
      required:
        - id
        - key
        - version
        - deploymentId
        - hasStartForm
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: integer
        category:
          type: string
        deploymentId:
          type: string
        hasStartForm:
          type: boolean
          default: false
        stats:
          allOf:
            - $ref: '#/components/schemas/ProcessInstanceStats'
          description: 'Instance counts. Present only when the request asked for `includeStats`.'
    ProcessDefinitionPage:
      x-kotlin-implements:
        - ru.briany.common.api.dtos.PagedList<ProcessDefinition>
      x-kotlin-implements-fields:
        - data
        - page
        - pageSize
        - totalElements
        - totalPages
        - hasNext
        - hasPrevious
      allOf:
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ProcessDefinition'
        - $ref: '#/components/schemas/PagedResponse'
    ResourceRef:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
        version:
          type: integer
      title: Short resource reference
      description: 'Used in compact collection listings (bpmn, cmmn, dmn, bform)'
    ProcessInstance:
      type: object
      examples:
        - id: '2501'
          name: Order
          businessKey: ORD-2026-0001
          state: running
